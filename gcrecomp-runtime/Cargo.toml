[package]
name = "gcrecomp-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime library for GameCube recompiled games"

[lib]
# Illustrative `///` examples (missing imports/setup), not executable contracts;
# they were failing as doctests. ponytail: don't run them as tests.
doctest = false

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
minifb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gilrs = "0.10"
# SDL is bundled so generic controllers work without a separate runtime install.
sdl2 = { version = "0.38", features = ["bundled"] }
hidapi = "2.0"
rusb = { version = "0.9", features = ["vendored"] }
image = "0.24"
imageproc = "0.23"
bytemuck = "1.14"
pollster = "0.4"

[dev-dependencies]
env_logger = "0.11"
