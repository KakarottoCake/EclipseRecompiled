name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  source-and-runtime:
    name: Source and runtime checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install compatible CMake
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin CMake for bundled SDL2
        run: python -m pip install "cmake==3.31.6"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test recompiler and runtime
        run: cargo test -p gcrecomp-core -p gcrecomp-runtime

      - name: Check CLI and host source
        run: cargo check -p gcrecomp-cli -p game
