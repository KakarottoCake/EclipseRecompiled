name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  source-and-runtime:
    name: Source and runtime checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test recompiler and runtime
        run: cargo test -p gcrecomp-core -p gcrecomp-runtime

      - name: Check CLI and host source
        run: cargo check -p gcrecomp-cli -p game
